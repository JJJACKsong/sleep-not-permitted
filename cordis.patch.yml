# sleep-not-permitted 的 bundle patch。
#
# 安装后 plugin_manager 会把本包按真实包名写进 profile 的
# `dsh.profile.bundles`，boot / 热重组时合并本 patch —— 也就是 insert 下面这一行。
#
# 行 id `sleep-not-permitted` 必须唯一：与 base / web-app 束的既有 id 不冲突。
#
# 配置含义见 README.md；想临时关掉整只守卫，把 enabled 改成 false 即可
# （或在 profile 的 cordis.patch.yml 里用同 id 覆盖）。
- insert:
    - id: sleep-not-permitted
      name: 'dsh-plugin-sleep-not-permitted'
      config:
        enabled: true
        # 能起 shell 命令的工具都受管；run_in_background: true 的调用直接放行。
        tools:
          - bash
          - pwsh
          - terminal_send
        # 阻塞等待型工具：一调用就是前台阻塞，不论参怎么给。
        # wait_agent = Team/子智能体等待（UI 卡片「等待子智能体」）。
        blockingTools:
          - wait_agent
        # 带 wait 开关的工具：只在 wait: true 时算阻塞等待。
        blockingWaitFlagTools:
          - job_output
        # 前台阻塞等待预算：0 = 一律拒绝；>0 = 只拒绝超过该毫秒数的等待。
        # 公开版默认 30 秒：放过短等待（团队协作常见），拦住几分钟的冻结。
        # 想要绝对严格（一秒钟都不许等）就改成 0。
        maxBlockingWaitMs: 30000
        # 轮询门禁：同一条检查命令在窗口内反复出现就拒绝。
        # 禁掉 sleep 之后，模型会用「check 一下、再 check 一下」代替等待——实测一个会话
        # 10 分钟内把同一条命令跑了 28 次；这里把它变成硬拒绝，并教它包成后台作业。
        antiPolling: true
        pollRepeatThreshold: 3     # 同一条命令在窗口内允许出现的次数上限，再多就拒
        pollWindowMs: 120000       # 统计窗口：2 分钟
        # 交互式/需确认命令门禁：后台拿不到输入会静默挂住（不结算、不通知），
        # 前台则直接卡住会话。这类命令先确认，再用非交互参数重启。
        interactiveGuard: true
        disabledInteractiveRules: []   # 按规则 id 关闭（id 见 README「规则」表）
        # 文案语言：auto（默认，跟随系统语言；中文环境只出中文）/ both / zh / en。
        # 判定顺序：DSH_LOCALE → LC_ALL/LC_MESSAGES/LANG → macOS 系统语言偏好 → Intl → 英文。
        language: auto
        # 事前预防：在系统提示里紧贴「后台作业」段落写同一条规则。
        announceInPrompt: true
        # 按规则 id 关掉个别检测（可用 id 见 README「规则」表）。
        disabledRules: []
        # 追加自定义规则：[{ id, pattern, label?, reason? }]，pattern 是正则字符串。
        extraRules: []
